<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Ocean & Sky Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06101E" />
      <stop offset="35%" stop-color="#0E223D" />
      <stop offset="65%" stop-color="#193B68" />
      <stop offset="85%" stop-color="#2C5282" />
      <stop offset="100%" stop-color="#3182CE" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="65%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F6AD55" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ED8936" stop-opacity="0.3" opacity="0.4" />
      <stop offset="100%" stop-color="#0E223D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="30%" stop-color="#13315C" />
      <stop offset="70%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#030C1A" />
    </linearGradient>

    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1F38" />
      <stop offset="30%" stop-color="#1E3A8A" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="hullLowerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="60%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>

    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="containerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="containerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="containerAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="containerTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="containerSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="superstructureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="wakeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="520" fill="url(#skyGrad)" />
  <circle cx="1050" cy="280" r="380" fill="url(#sunGlow)" />

  <!-- Horizon Light Rays & Clouds -->
  <path d="M0 320 Q 400 290, 800 310 T 1600 295 L 1600 520 L 0 520 Z" fill="#1E3A8A" opacity="0.25" />
  <path d="M0 370 Q 500 340, 1000 360 T 1600 350 L 1600 520 L 0 520 Z" fill="#0EA5E9" opacity="0.12" />

  <!-- Calm Waves / Water -->
  <rect y="500" width="1600" height="400" fill="url(#seaGrad)" />
  
  <!-- Ocean Horizon Glow Line -->
  <line x1="0" y1="500" x2="1600" y2="500" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />

  <!-- Background Distance Ship -->
  <g opacity="0.35">
    <path d="M 150 490 L 260 490 L 250 498 L 160 498 Z" fill="#1E293B" />
    <rect x="180" y="475" width="45" height="15" fill="#334155" />
    <rect x="200" y="465" width="10" height="10" fill="#475569" />
  </g>

  <!-- MAIN CARGO VESSEL -->
  <g id="mainVessel">

    <!-- Ship Wake & Foam Base -->
    <path d="M 120 560 Q 300 575, 600 565 T 1480 545 L 1550 560 L 1400 580 Q 800 595, 200 575 Z" fill="url(#wakeGlow)" />
    <ellipse cx="1420" cy="545" rx="60" ry="8" fill="#E0F2FE" opacity="0.7" filter="url(#softGlow)" />
    <path d="M 150 558 C 100 562, 40 570, 0 580 L 0 565 C 50 558, 110 552, 160 554 Z" fill="#E0F2FE" opacity="0.5" />

    <!-- Lower Hull (Red Anti-Fouling Bottom) -->
    <path d="M 220 540 L 1380 535 L 1440 520 L 1420 542 L 1330 556 L 310 560 Z" fill="url(#hullLowerGrad)" />

    <!-- Main Hull (Royal Navy/Maritime Blue) -->
    <path d="M 200 538 L 1395 530 L 1475 470 L 1350 470 L 280 470 L 170 515 Z" fill="url(#hullGrad)" />
    
    <!-- Hull Waterline Accent Stripe (Vessel Cyan) -->
    <path d="M 195 535 L 1400 527 L 1410 520 L 190 528 Z" fill="url(#accentTeal)" opacity="0.9" />

    <!-- Ship Name & Details on Bow -->
    <text x="1370" y="490" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="2" opacity="0.9">SHIPYON EXIM</text>
    <circle cx="1440" cy="485" r="4" fill="#F59E0B" />
    <line x1="1440" y1="485" x2="1440" y2="510" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- CONTAINER STACKS (Multi-colored, High Contrast Deck Freight) -->

    <!-- Row 1 (Lowest Row of Containers) -->
    <!-- Bay A -->
    <rect x="290" y="442" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="368" y="442" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="446" y="442" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="524" y="442" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="602" y="442" width="75" height="28" fill="url(#containerSlate)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="680" y="442" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="758" y="442" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="836" y="442" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="914" y="442" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="992" y="442" width="75" height="28" fill="url(#containerSlate)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1070" y="442" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1148" y="442" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />

    <!-- Row 2 -->
    <rect x="300" y="413" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="378" y="413" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="456" y="413" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="534" y="413" width="75" height="28" fill="url(#containerSlate)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="612" y="413" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="690" y="413" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="768" y="413" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="846" y="413" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="924" y="413" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1002" y="413" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1080" y="413" width="75" height="28" fill="url(#containerSlate)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1158" y="413" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />

    <!-- Row 3 -->
    <rect x="378" y="384" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="456" y="384" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="534" y="384" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="612" y="384" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="690" y="384" width="75" height="28" fill="url(#containerSlate)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="768" y="384" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="846" y="384" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="924" y="384" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="1002" y="384" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />

    <!-- Row 4 (Top Stacks) -->
    <rect x="534" y="355" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="612" y="355" width="75" height="28" fill="url(#containerTeal)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="690" y="355" width="75" height="28" fill="url(#containerAmber)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="768" y="355" width="75" height="28" fill="url(#containerRed)" stroke="#0F172A" stroke-width="1" rx="1" />
    <rect x="846" y="355" width="75" height="28" fill="url(#containerBlue)" stroke="#0F172A" stroke-width="1" rx="1" />

    <!-- Container Vertical Details / Lines -->
    <line x1="327" y1="442" x2="327" y2="470" stroke="#000" stroke-width="0.5" opacity="0.4" />
    <line x1="405" y1="442" x2="405" y2="470" stroke="#000" stroke-width="0.5" opacity="0.4" />
    <line x1="483" y1="442" x2="483" y2="470" stroke="#000" stroke-width="0.5" opacity="0.4" />
    <line x1="561" y1="442" x2="561" y2="470" stroke="#000" stroke-width="0.5" opacity="0.4" />

    <!-- SUPERSTRUCTURE & BRIDGE (Modern Multi-tier Tower) -->
    <g id="superstructure">
      <!-- Main Block -->
      <rect x="1230" y="330" width="100" height="140" fill="url(#superstructureGrad)" rx="2" />
      
      <!-- Bridge Wings -->
      <rect x="1215" y="345" width="130" height="20" fill="#F8FAFC" rx="2" />
      <rect x="1220" y="348" width="120" height="12" fill="#0EA5E9" opacity="0.8" /> <!-- Glass Windows -->

      <!-- Lower Windows Deck 1 -->
      <rect x="1240" y="380" width="80" height="8" fill="#1E293B" />
      <rect x="1240" y="400" width="80" height="8" fill="#1E293B" />
      <rect x="1240" y="420" width="80" height="8" fill="#1E293B" />

      <!-- Funnel / Chimney -->
      <path d="M 1285 275 L 1315 275 L 1310 330 L 1280 330 Z" fill="#DC2626" />
      <rect x="1282" y="275" width="31" height="12" fill="#1E293B" />
      <circle cx="1297" cy="302" r="10" fill="#F59E0B" />
      <text x="1293" y="306" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">S</text>

      <!-- Smoke Trail (Soft White Gradient) -->
      <ellipse cx="1270" cy="255" rx="35" ry="12" fill="#FFFFFF" opacity="0.25" filter="url(#softGlow)" />
      <ellipse cx="1230" cy="235" rx="60" ry="18" fill="#FFFFFF" opacity="0.15" filter="url(#softGlow)" />
      <ellipse cx="1170" cy="210" rx="90" ry="25" fill="#FFFFFF" opacity="0.08" filter="url(#softGlow)" />

      <!-- Radar Mast & Antennas -->
      <line x1="1265" y1="330" x2="1265" y2="260" stroke="#475569" stroke-width="2.5" />
      <line x1="1255" y1="280" x2="1275" y2="280" stroke="#475569" stroke-width="2" />
      <line x1="1250" y1="295" x2="1280" y2="295" stroke="#475569" stroke-width="1.5" />
      <circle cx="1265" cy="258" r="3" fill="#38BDF8" />
    </g>

    <!-- Deck Cranes / Support Rigging -->
    <line x1="375" y1="442" x2="375" y2="380" stroke="#64748B" stroke-width="2" />
    <line x1="765" y1="442" x2="765" y2="350" stroke="#64748B" stroke-width="2" />
    <line x1="1145" y1="442" x2="1145" y2="380" stroke="#64748B" stroke-width="2" />

    <!-- Forecastle Light & Flag Mast -->
    <line x1="1475" y1="470" x2="1475" y2="430" stroke="#CBD5E1" stroke-width="2" />
    <polygon points="1475,432 1495,438 1475,444" fill="#0EA5E9" />
    <circle cx="1475" cy="430" r="2.5" fill="#F59E0B" />

  </g>

  <!-- Foreground Ocean Waves with Highlights -->
  <path d="M 0 570 C 300 550, 600 585, 900 560 C 1200 535, 1400 565, 1600 550 L 1600 900 L 0 900 Z" fill="#0A192F" opacity="0.6" />
  <path d="M 0 620 C 400 590, 800 640, 1200 610 C 1450 590, 1550 615, 1600 605 L 1600 900 L 0 900 Z" fill="#030C1A" opacity="0.9" />

  <!-- Shimmering Light Reflections on Ocean Surface -->
  <ellipse cx="1050" cy="530" rx="300" ry="10" fill="#F59E0B" opacity="0.25" filter="url(#softGlow)" />
  <ellipse cx="980" cy="570" rx="220" ry="8" fill="#38BDF8" opacity="0.2" filter="url(#softGlow)" />
</svg>
