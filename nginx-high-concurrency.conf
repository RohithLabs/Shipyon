# ==============================================================================
# SHIPYON EXIM — HIGH-CONCURRENCY NGINX SERVER CONFIGURATION
# Designed for 100,000+ Concurrent Users (1 Lakh Users) with Zero-Crash Architecture
# ==============================================================================

# 1. System Worker Tuning
user nginx;
worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 2. Kernel File Acceleration (Zero-Copy Transfer)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts (Prevent resource starvation under high concurrency)
    keepalive_timeout 65;
    keepalive_requests 10000;
    send_timeout 15;
    client_body_timeout 15;
    client_header_timeout 15;
    reset_timedout_connection on;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # 3. Kernel Open File Cache (Serves cached file descriptors directly from RAM)
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 4. High-Throughput Compression (Reduces bandwidth & latency by ~75%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 5. Anti-DDoS & Traffic Rate Limiting
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;

    # ==========================================================================
    # SHIPYON PRODUCTION SERVER BLOCK
    # ==========================================================================
    server {
        listen 80;
        listen 443 ssl http2;
        server_name shipyon.in www.shipyon.in;
        root /var/www/shipyon;
        index index.html;

        # TLS 1.3 Modern Encryption
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ======================================================================
        # 6. HARDENED HTTP SECURITY HEADERS
        # ======================================================================
        # HSTS (Strict Transport Security - 2 Years)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Content Security Policy (Prevents XSS, code injection, and rogue frames)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://wa.me; frame-ancestors 'none';" always;

        # Prevent Clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type Sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Referrer Privacy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Feature Permissions
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ======================================================================
        # 7. ROUTING & CACHING POLICY
        # ======================================================================
        # Root location with burst protection
        location / {
            limit_req zone=req_limit_per_ip burst=100 nodelay;
            limit_conn conn_limit_per_ip 100;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, no-cache, must-revalidate";
        }

        # Immutable Caching for Static Images & Assets (Served instantly from Edge)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            log_not_found off;
        }

        # CSS & JavaScript Caching
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            access_log off;
        }

        # Block Hidden Files (.git, .env)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom Error Pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
